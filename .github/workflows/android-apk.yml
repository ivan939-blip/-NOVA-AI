name: Build NOVA AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'native-android/**'
      - 'src/main.js'
      - 'capacitor.config.json'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install project dependencies
        run: npm ci
      - name: Verify application
        run: |
          npm test
          npm run build
      - name: Install Android wrapper tools
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate Android project
        run: npx cap add android
      - name: Add native NOVA voice support
        run: |
          mkdir -p android/app/src/main/java/ai/nova/studio
          cp native-android/MainActivity.java android/app/src/main/java/ai/nova/studio/MainActivity.java
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); s=s.replace("<application", """<uses-permission android:name="android.permission.RECORD_AUDIO" />
              <queries><intent><action android:name="android.speech.RecognitionService" /></intent><package android:name="com.android.chrome" /><package android:name="com.google.android.youtube" /><package android:name="com.google.android.apps.maps" /></queries>
              <application""",1); s=s.replace("android:name=\".MainActivity\"", "android:name=\"ai.nova.studio.MainActivity\""); p.write_text(s)'
      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
